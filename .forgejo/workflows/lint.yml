# Runs the same pre-commit gate the workstation runs, on ci01.
#
# Local hooks are the fast path and SHOULD stay skippable; this is the backstop.
# They only protect commits on a machine where someone ran `pre-commit install`,
# and `--no-verify` bypasses them by design.
#
# ⚠️ This repo has an OUTSIDE CONTRIBUTOR, which the others do not. Their work
# arrives on GitHub, where these workflows do not run — so this gate covers what
# lands here, not everything that lands anywhere. Do not read a green run as
# proof the GitHub copy is clean.
name: lint
# ⚠️ QUOTED DELIBERATELY. `on` is a YAML 1.1 boolean, so unquoted it parses as
# `true:`. Harmless to Forgejo, but ansible-lint rejects it in the repos that
# run that hook — keep the workflows identical in shape.
"on": [push, pull_request]

env:
  # Pinned to what the workstation runs, so CI enforces the same thing rather
  # than whatever upstream released this morning.
  # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
  GITLEAKS_VERSION: "8.30.1"
  # renovate: datasource=github-releases depName=koalaman/shellcheck extractVersion=^v(?<version>.*)$
  SHELLCHECK_VERSION: "0.11.0"
  # renovate: datasource=pypi depName=flake8
  FLAKE8_VERSION: "7.3.0"

jobs:
  pre-commit:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          # gitleaks needs history to scan, not just the tip commit.
          fetch-depth: 0

      - name: Install the hook toolchain
        run: |
          set -euo pipefail
          apt-get update -qq
          # ⚠️ python3-venv IS REQUIRED, not optional. This image ships no
          # ensurepip, so without it `python3 -m venv` fails with a message
          # naming python3.13-venv that reads like a missing interpreter rather
          # than a missing package.
          apt-get install -y -qq --no-install-recommends \
            python3-pip python3-venv unzip xz-utils jq >/dev/null
          npm install -g markdownlint-cli2 --silent
          # ⚠️ shellcheck is pinned rather than taken from apt. Debian ships an
          # older release whose SC2015 heuristic fires where 0.11.0 does not, so
          # an unpinned CI enforces a different standard than the workstation
          # and fails on code that is fine.
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          # ⚠️ A VENV, NOT `pip --break-system-packages`, AND THIS IS NOT A
          # STYLE PREFERENCE — the old form stopped working entirely.
          #
          # `apt-get install python3-pip` pulls Debian's dpkg-managed
          # python3-packaging (25.0 on trixie). pre-commit's dependency tree now
          # wants packaging newer than that, so pip tried to replace the
          # dpkg-installed copy, found no RECORD file, and aborted:
          #
          #   error: uninstall-no-record-file
          #   Cannot uninstall packaging 25.0
          #   The package's contents are unknown: no RECORD file was found
          #
          # ⚠️ `pre-commit` ALONE is enough to trigger this — verified in this
          # exact image with no other package. Every lint.yml in the estate shared
          # this pattern, so all thirteen were fixed together rather than as each
          # repo's next push went red.
          #
          # ⚠️ THE VERSION PINS DID NOT PREVENT IT. They pin the tools a repo
          # names; `packaging` is a transitive dependency of pre-commit and floats.
          # The fix is isolation from dpkg, not pinning more of the tree.
          python3 -m venv /opt/hooks
          /opt/hooks/bin/pip install --quiet "flake8==${FLAKE8_VERSION}" pre-commit
          # ⚠️ $GITHUB_PATH, not `export PATH`. The pre-commit hooks are
          # `language: system` and run in LATER steps; an export dies with this
          # shell and they would resolve the system python with none of this
          # installed.
          echo /opt/hooks/bin >> "$GITHUB_PATH"

      - name: Run the pre-commit gate
        run: pre-commit run --all-files --show-diff-on-failure

      # ⚠️ NOT redundant with the gitleaks hook above. That hook is
      # `gitleaks git --pre-commit --staged`, which is correct locally and scans
      # NOTHING in CI, because CI has no staged changes — it would pass
      # vacuously on the one hook that matters most.
      - name: Scan the working tree for secrets
        run: gitleaks dir . --redact --verbose

      - name: Scan history for NEW secrets
        run: |
          if [ -f .gitleaks-baseline.json ]; then
            gitleaks git . --redact --verbose --baseline-path .gitleaks-baseline.json
          else
            gitleaks git . --redact --verbose
          fi
